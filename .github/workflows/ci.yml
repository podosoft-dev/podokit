name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: npm test

  generated-bun-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Verify a Bun-only generated app
        run: |
          app_dir="$(mktemp -d)"
          node scripts/dev-app.mjs "$app_dir" \
            --add admin-dashboard,job-progress,api-key-auth,audit-log,file-upload,logging,rate-limit,blog,analytics \
            --no-build
          (
            cd "$app_dir"
            # An API build target of the app's own, as applications add in the
            # owned build.extensions.mjs; the managed tests must not depend on it.
            echo 'export const appBuildTargets = [{ entrypoint: "scripts/app-task.ts", outdir: "dist/scripts" }];' \
              > apps/api/scripts/build.extensions.mjs
            echo 'console.log("app task");' > apps/api/scripts/app-task.ts
            bun run lint
            bun run test
            bun run build
            test "$(bun apps/api/dist/scripts/app-task.js)" = "app task"
            node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" status --json | grep -q '"runtime": "bun"'
            # The built web server checks cross-site form submissions and `vite dev`
            # does not. A POST without a body or Origin header, as API clients send
            # it, must reach the API through /api; a cross-site form must not.
            (set -a && . ./.env.example && set +a && cd apps/api && PORT=5012 exec bun dist/main.js) \
              < /dev/null > "$RUNNER_TEMP/api.log" 2>&1 &
            api=$!
            (cd apps/web && PORT=5011 BACKEND_INTERNAL_URL=http://127.0.0.1:5012 exec bun build/index.js) \
              < /dev/null > "$RUNNER_TEMP/web.log" 2>&1 &
            web=$!
            for _ in $(seq 1 30); do
              curl -sf -m 2 -o /dev/null http://127.0.0.1:5012/health \
                && curl -sf -m 2 -o /dev/null http://127.0.0.1:5011/healthz && break
              sleep 1
            done
            status() { curl -s -m 5 -o /dev/null -w '%{http_code}' "$@" || true; }
            no_origin=$(status -X POST http://127.0.0.1:5011/api/health)
            cross_site=$(status -X POST -H 'origin: https://cross-site.example' -d note=ping http://127.0.0.1:5011/)
            kill "$api" "$web" 2> /dev/null || true
            echo "POST /api/health without Origin: $no_origin; cross-site form POST /: $cross_site"
            if [ "$no_origin" != 404 ] || [ "$cross_site" != 403 ]; then
              cat "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log"
              exit 1
            fi
          )
