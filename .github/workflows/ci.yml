name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: npm test

  bun-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Verify Node to Bun to Node conversion
        run: |
          app_dir="$(mktemp -d)"
          node packages/cli/dist/index.js create app --dir "$app_dir" --no-ai --yes
          (
            cd "$app_dir"
            node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" add admin-dashboard
            node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" add job-progress
            node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" add api-key-auth
            node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" add audit-log
            node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" add file-upload
            node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" add logging
            node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" add rate-limit
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e BUN_INSTALL_CACHE_DIR=/tmp/bun-cache \
              -v "$app_dir:/app" \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -w /app \
              oven/bun:1.4.0-alpine \
              bun /workspace/packages/cli/dist/index.js runtime set bun --apply
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e BUN_INSTALL_CACHE_DIR=/tmp/bun-cache \
              -v "$app_dir:/app" \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -w /app \
              oven/bun:1.4.0-alpine \
              bun /workspace/packages/cli/dist/index.js status --json | grep -q '"runtime": "bun"'
            node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" runtime set node --apply
            node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" status --json | grep -q '"runtime": "node"'
          )
