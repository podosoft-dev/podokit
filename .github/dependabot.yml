version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      better-auth:
        patterns:
          - "better-auth"
          - "@better-auth/*"
      dev-dependencies:
        dependency-type: development
    ignore:
      # Published packages support Node 20; keep compilation on matching Node types.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript majors need a moduleResolution migration — handle deliberately.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
